<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Glotzkiste: a goggle box. A violet TV whose screen is a 2x2 multiview,
       with two big eyes staring out. Readable down to 16 px: box + eyes. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.55" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#231D45"/>
      <stop offset="1" stop-color="#0C0A18"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E0F5"/>
    </radialGradient>
  </defs>

  <!-- antennas -->
  <path d="M256 146 L172 50 M256 146 L346 38" stroke="#C4B5FD" stroke-width="20" stroke-linecap="round" fill="none"/>
  <circle cx="172" cy="50" r="24" fill="#F472B6"/>
  <circle cx="346" cy="38" r="24" fill="#FBBF24"/>

  <!-- feet -->
  <rect x="122" y="430" width="64" height="54" rx="18" fill="#4C1D95"/>
  <rect x="326" y="430" width="64" height="54" rx="18" fill="#4C1D95"/>

  <!-- body -->
  <rect x="32" y="128" width="448" height="324" rx="92" fill="url(#body)"/>
  <rect x="56" y="140" width="400" height="46" rx="23" fill="#FFFFFF" opacity="0.16"/>

  <!-- screen with a 2x2 multiview -->
  <rect x="72" y="168" width="368" height="252" rx="56" fill="url(#screen)"/>
  <g opacity="0.55">
    <rect x="96" y="190" width="154" height="98" rx="22" fill="#22D3EE" opacity="0.35"/>
    <rect x="262" y="190" width="154" height="98" rx="22" fill="#F472B6" opacity="0.35"/>
    <rect x="96" y="300" width="154" height="98" rx="22" fill="#34D399" opacity="0.35"/>
    <rect x="262" y="300" width="154" height="98" rx="22" fill="#FBBF24" opacity="0.35"/>
  </g>

  <!-- the staring eyes -->
  <circle cx="190" cy="292" r="66" fill="url(#eye)"/>
  <circle cx="322" cy="292" r="66" fill="url(#eye)"/>
  <circle cx="212" cy="276" r="32" fill="#0C0A18"/>
  <circle cx="344" cy="276" r="32" fill="#0C0A18"/>
  <circle cx="222" cy="264" r="10" fill="#FFFFFF"/>
  <circle cx="354" cy="264" r="10" fill="#FFFFFF"/>

  <!-- live dot -->
  <circle cx="404" cy="392" r="12" fill="#EF4444"/>
</svg>
