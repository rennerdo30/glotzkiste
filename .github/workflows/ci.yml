name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  # One self-contained exe: static C runtime; the libmpv build needs AVX2.
  RUSTFLAGS: "-C target-feature=+crt-static -C target-cpu=x86-64-v3"
jobs:
  test:
    name: fmt, clippy, tests
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
  installer:
    name: Windows setup (build and lifecycle)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Release build with the pinned libmpv inside
        shell: pwsh
        run: |
          $env:GK_LIBMPV = ./scripts/fetch-libmpv.ps1 -Destination "$env:RUNNER_TEMP/libmpv"
          cargo build --release --locked -p glotzkiste
          if ($LASTEXITCODE) { throw 'build failed' }
      - name: Package (pinned NSIS 3.13) and test install, reinstall, uninstall
        shell: pwsh
        run: |
          $makensis = ./scripts/fetch-nsis.ps1 -Destination "$env:RUNNER_TEMP/nsis"
          $meta = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          ./scripts/package.ps1 -MakeNsis $makensis -BinDir (Join-Path $meta.target_directory 'release')
          $toml = Get-Content Cargo.toml -Raw
          $null = $toml -match '(?m)^\[workspace\.package\][\s\S]*?^version\s*=\s*"([^"]+)"'
          $v = $Matches[1]
          ./scripts/test-installer.ps1 -Setup (Resolve-Path "artifacts/installer/glotzkiste-$v-setup.exe") -Version $v
  deny:
    name: cargo-deny (licenses)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses
