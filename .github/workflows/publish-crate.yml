name: publish-crate

# Uploads the crates to crates.io (cargo install glotzkiste). Manual only:
# the owner starts it from the Actions tab after the GitHub release of the
# same tag is published. Needs the ENVIRONMENT secret CARGO_REGISTRY_TOKEN in
# the "crates-io" environment (not a repository secret; docs/RELEASING.md).
# The token is in the env of the last step only: the package check compiles
# every crate (build scripts, proc macros of dependencies) in a separate step
# WITHOUT the token, and the publish step runs with --no-verify so no
# compiled code ever runs next to the token. Windows runner: the app and its
# renderer build only there.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (vX.Y.Z)'
        required: true
        type: string
      package:
        description: 'Only this crate (e.g. glotzkiste, after a rate limit stopped a run); empty: all, in order'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-crate
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 40
    environment: crates-io
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      # Only a commit that is on main is published.
      - name: Tag commit is an ancestor of origin/main
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          sha=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$sha" refs/remotes/origin/main; then
            echo "Tag $TAG (${sha:0:7}) is not on main; refusing to publish it." >&2
            exit 1
          fi
      - name: Tag matches the workspace version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in v[0-9]*) ;; *) echo "Not a version tag: $TAG" >&2; exit 1 ;; esac
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Crate name is one of ours
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          case "$PACKAGE" in
            ""|glotzkiste|glotzkiste-mpv|glotzkiste-twitch|glotzkiste-chat|glotzkiste-update|glotzkiste-render) ;;
            *) echo "Unknown crate: $PACKAGE" >&2; exit 1 ;;
          esac
      # rust-toolchain.toml pins the toolchain; this installs it.
      - run: rustup show active-toolchain
      # Builds every packaged crate to verify it. No secret in this step's env.
      - name: Package and verify (no token, no upload)
        run: cargo package --workspace --exclude gk-icon --locked
      # Verified above; --no-verify keeps the token away from compiled code.
      # All crates in dependency order, or the one named.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          if [ -n "$PACKAGE" ]; then
            cargo publish -p "$PACKAGE" --locked --no-verify
          else
            cargo publish --workspace --exclude gk-icon --locked --no-verify
          fi
