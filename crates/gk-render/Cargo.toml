[package]
name = "glotzkiste-render"
description = "D3D11 renderer for Glotzkiste: stream textures, egui renderer, render workers, one present per refresh."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["d3d11", "egui", "mpv", "video"]
categories = ["multimedia::video", "gui"]
include = ["/src/**", "/Cargo.toml"]

# The code name stays gk_render (as in the app).
[lib]
name = "gk_render"

[package.metadata.docs.rs]
targets = ["x86_64-pc-windows-msvc"]

[dependencies]
egui.workspace = true
gk-mpv.workspace = true
png = "0.18.1"
log.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_Threading",
] }
