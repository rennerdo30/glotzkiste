[package]
name = "glotzkiste"
description = "Glotzkiste: multi-stream live viewer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gk-mpv = { path = "../gk-mpv" }
gk-twitch = { path = "../gk-twitch" }
serde_json.workspace = true
gk-render = { path = "../gk-render" }
gk-chat = { path = "../gk-chat" }
egui.workspace = true
egui-winit.workspace = true
egui_tiles.workspace = true
winit.workspace = true
serde.workspace = true
log.workspace = true
zstd = { version = "0.14.4", default-features = false }
rfd = { version = "0.18.0", default-features = false }

[build-dependencies]
zstd = { version = "0.14.4", default-features = false, features = ["zstdmt"] }
