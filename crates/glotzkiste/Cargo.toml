[package]
name = "glotzkiste"
description = "Glotzkiste: watch many Twitch streams and chats at once on Windows, in tabs and free tile layouts, hardware decoded on every GPU."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["twitch", "multistream", "viewer", "mpv", "streaming"]
categories = ["multimedia::video", "gui"]
include = ["/src/**", "/res/**", "/examples/**", "/build.rs", "/glotzkiste.rc", "/Cargo.toml"]

[package.metadata.docs.rs]
targets = ["x86_64-pc-windows-msvc"]

[dependencies]
gk-mpv.workspace = true
gk-twitch.workspace = true
serde_json.workspace = true
gk-render.workspace = true
gk-chat.workspace = true
gk-update.workspace = true
egui.workspace = true
egui-winit.workspace = true
egui_tiles.workspace = true
winit.workspace = true
serde.workspace = true
log.workspace = true
rfd = { version = "0.18.0", default-features = false }

[build-dependencies]
embed-resource = "3.0.12"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Media", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_Performance", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
