[package]
name = "glotzkiste"
description = "Glotzkiste: multi-stream live viewer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gk-mpv = { path = "../gk-mpv" }
gk-twitch = { path = "../gk-twitch" }
serde_json.workspace = true
gk-render = { path = "../gk-render" }
gk-chat = { path = "../gk-chat" }
gk-update = { path = "../gk-update" }
egui.workspace = true
egui-winit.workspace = true
egui_tiles.workspace = true
winit.workspace = true
serde.workspace = true
log.workspace = true
rfd = { version = "0.18.0", default-features = false }

[build-dependencies]
embed-resource = "3.0.12"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Media", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_Performance", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
