[workspace]
resolver = "3"
members = ["crates/*"]
# The icon tool only runs by hand (cargo run -p gk-icon).
default-members = ["crates/gk-mpv", "crates/gk-twitch", "crates/gk-chat", "crates/gk-render", "crates/gk-update", "crates/glotzkiste"]

[workspace.package]
version = "1.2.1"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/rennerdo30/glotzkiste"

[workspace.dependencies]
# The app's own crates, published to crates.io as glotzkiste-* (their code
# names stay gk_*). The version moves with the workspace version: a release
# bumps both (docs/RELEASING.md).
gk-mpv = { package = "glotzkiste-mpv", path = "crates/gk-mpv", version = "1.2.1" }
gk-twitch = { package = "glotzkiste-twitch", path = "crates/gk-twitch", version = "1.2.1" }
gk-chat = { package = "glotzkiste-chat", path = "crates/gk-chat", version = "1.2.1" }
gk-update = { package = "glotzkiste-update", path = "crates/gk-update", version = "1.2.1" }
gk-render = { package = "glotzkiste-render", path = "crates/gk-render", version = "1.2.1" }
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-winit = { version = "0.37.0", default-features = false, features = ["clipboard", "links"] }
egui_tiles = "0.18.0"
winit = "0.30.13"
windows = "0.62.2"
ureq = { version = "3.5.2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "webp"] }
log = "0.4"

# Fast iteration: dependencies optimised once and cached by sccache,
# workspace crates incremental.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
opt-level = 3

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
