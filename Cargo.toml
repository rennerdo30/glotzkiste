[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = ""
publish = false

[workspace.dependencies]
egui = "0.37.0"
egui-winit = { version = "0.37.0", default-features = false, features = ["clipboard", "links"] }
egui_tiles = "0.18.0"
winit = "0.30.13"
windows = "0.62.2"
ureq = { version = "3.5.2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "webp"] }
rustls = "0.23"
webpki-roots = "1"
log = "0.4"

# Fast iteration: dependencies optimised once and cached by sccache,
# workspace crates incremental.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
opt-level = 3

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
